name: Fetch MakeHuman assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/fetch-assets.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download CC0 packs
        run: |
          set -e
          mkdir -p dl && cd dl
          get() { curl -fsSL --retry 3 -o "$1.zip" "https://files2.makehumancommunity.org/asset_packs/$1/$1_cc0.zip" || curl -fsSL --retry 3 -o "$1.zip" "https://files.makehumancommunity.org/asset_packs/$1/$1_cc0.zip"; }
          get makehuman_system_assets
          get shirts01
          get pants01
          get shoes01
          for z in *.zip; do unzip -q -o "$z" -d x; done
          find x -maxdepth 3 -type d | sort | head -80
          du -sh x/*
      - name: Keep what the renderer needs
        run: |
          set -e
          mkdir -p out
          cd dl/x
          find . -type d \( -path "*/skins/young*" -o -path "*/skins/textures" -o -path "*/hair/*" -o -path "*/eyebrows/*" -o -path "*/eyelashes/*" -o -path "*/eyes/*" -o -path "*/clothes/*" -o -path "*/teeth/*" -o -path "*/tongue/*" \) -prune -print | while read d; do mkdir -p "../../out/$(dirname "$d")"; cp -r "$d" "../../out/$(dirname "$d")/"; done
          cp -r */skins/*.mhmat ../../out/ 2>/dev/null || true
          find . -maxdepth 4 -name "*.txt" -o -maxdepth 4 -name "LICENSE*" | head
          cd ../../out
          find . -type f -size +95M -print -delete
          du -sh .; find . -maxdepth 3 -type d | sort | head -120
      - name: Publish to the mhassets branch
        run: |
          cd out
          git init -q -b mhassets
          git config user.name "forge-bot"; git config user.email "forge-bot@users.noreply.github.com"
          git add -A && git commit -qm "MakeHuman CC0 asset subset"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" mhassets
